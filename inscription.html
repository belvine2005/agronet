<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroNet – Inscription</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <section class="inscription-section">
    <div class="inscription-container">
      <div class="inscription-header">
        <h2>Créer un compte</h2>
        <p>Rejoignez AgroNet et accédez à toutes nos fonctionnalités</p>
      </div>

      <form class="inscription-form" id="inscriptionForm">
        
        <div class="form-row">
          <div class="form-group">
            <label for="prenom">Prénoms</label>
            <input type="text" id="prenom" name="prenom" required placeholder="Vos prénoms">
          </div>
          <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required placeholder="Votre nom">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="votre.email@exemple.com">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" name="telephone" required placeholder="+229 XX XX XX XX">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required placeholder="Minimum 8 caractères">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmer le mot de passe</label>
            <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirmez votre mot de passe">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="adresse">Adresse</label>
            <input type="text" id="adresse" name="adresse" required placeholder="Votre adresse complète">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="role">Vous êtes un :</label>
            <select id="role" name="role" required>
              <option value="" disabled selected>Choisissez votre profil...</option>
              <option value="producteur">Producteur</option>
              <option value="fournisseur">Fournisseur</option>
              <option value="acheteur">Acheteur</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="biographie">Biographie</label>
            <textarea id="biographie" name="biographie" rows="5" placeholder="Parlez-nous de vous, de votre activité agricole..."></textarea>
          </div>
        </div>

        <div class="form-group checkbox">
          <input type="checkbox" id="conditions" name="conditions" required>
          <label for="conditions">J'accepte les conditions d'utilisation et la politique de confidentialité</label>
        </div>

        <button type="submit" class="btn-inscription">Créer mon compte</button>
        <p class="login-link">Vous avez déjà un compte? <a href="connexion.html">Connectez-vous</a></p>
      </form>
    </div>
  </section>
  
</body>
</html>
