<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroMarché – Connexion</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- CONNEXION -->
  <section class="connexion-section">
    <div class="connexion-container">
      <div class="connexion-header">
        <h2>Se connecter</h2>
        <p>Connectez-vous à votre compte AgroMarché</p>
      </div>

      <form class="connexion-form" id="connexionForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="votre.email@exemple.com">
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required placeholder="Votre mot de passe">
        </div>

        <button type="submit" class="btn-connexion">Se connecter</button>
        <p class="register-link">Vous n'avez pas de compte? <a href="inscription.html">Inscrivez-vous</a></p>
      </form>
    </div>
  </section>
</body>
</html>
